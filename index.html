<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT.NOAH 학생부</title>
  <meta name="description" content="PROJECT.NOAH — 방주에 오른 12명의 학생부">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;700&family=Lexend+Peta:wght@300;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 바다 배경 -->
  <div class="sea" aria-hidden="true">
    <div class="caustics"></div>
    <div class="bubbles"></div>
  </div>

  <header class="top">
    <div class="logo">PROJECT<span>.</span>NOAH</div>
    <div class="top-meta">
      <span class="blink">●</span> 방주 기록 열람 중
    </div>
  </header>

  <main class="board">
    <div class="board-head">
      <p class="eyebrow">ARK RECORD · 학생부</p>
      <h1>탑승자 열두 명</h1>
      <p class="sub">학생증을 눌러 기록을 여세요.</p>
    </div>

    <div class="deck">
      <section class="row row-5" id="row1"></section>
      <section class="row row-7" id="row2"></section>
    </div>

    <p class="footnote">기억이 아직 돌아오지 않은 기록은 가려져 있습니다.</p>
  </main>

  <!-- 프로필 오버레이 -->
  <div class="profile" id="profile" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="pName">
    <div class="profile-scrim" data-close></div>

    <button class="p-nav p-prev" id="pPrev" aria-label="이전 학생">‹</button>
    <button class="p-nav p-next" id="pNext" aria-label="다음 학생">›</button>

    <div class="profile-inner">
      <button class="p-close" data-close aria-label="닫기">✕</button>

      <div class="p-left">
        <div class="p-portrait" id="pPortrait"></div>
        <div class="p-no" id="pNo">No.01</div>
      </div>

      <div class="p-right">
        <div class="p-block p-title">
          <span class="p-tag" id="pTag"></span>
          <h2 id="pName"></h2>
          <span class="p-en" id="pEn"></span>
        </div>

        <div class="p-block p-stats">
          <div class="stat"><span>반</span><b id="pCls"></b></div>
          <div class="stat"><span>성별</span><b id="pGender"></b></div>
          <div class="stat"><span>키</span><b id="pHeight"></b></div>
          <div class="stat"><span>상태</span><b class="alive">생존</b></div>
        </div>

        <div class="p-block p-quote" id="pQuoteWrap">
          <p id="pQuote"></p>
        </div>

        <div class="p-block p-desc">
          <h3>기록</h3>
          <p id="pDesc"></p>
          <ul class="traits" id="pTraits"></ul>
        </div>

        <div class="p-block p-memory">
          <h3>기억 복원율 <em id="pMemNum">0%</em></h3>
          <div class="bar"><i id="pMemBar"></i></div>
        </div>

        <div class="p-block p-reason">
          <h3>나가야 하는 이유</h3>
          <p id="pReason"></p>
        </div>

        <div class="p-block p-counter">
          <h3>고발 카운터</h3>
          <div class="pips"><i></i><i></i></div>
          <span class="pips-txt">2 / 2</span>
        </div>
      </div>
    </div>
  </div>

  <script src="students.js"></script>
  <script src="app.js"></script>
</body>
</html>
